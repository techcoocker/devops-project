name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t chikichik/devops-app:latest .

      - name: Run a test
        run: echo "Running tests... (placeholder for now)"

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: chikichik/devops-app:latest
          format: table
          exit-code: 0

      - name: Push image to Docker Hub
        run: docker push chikichik/devops-app:latest
